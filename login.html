<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetControl - Login</title>
  <style>
    :root {
      --bg: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --border: #30363d;
      --text: #c9d1d9;
      --text-dim: #8b949e;
      --accent: #238636;
      --accent-hover: #2ea043;
      --danger: #da3633;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
    }
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }
    .logo h1 {
      font-size: 28px;
      color: var(--text);
    }
    .logo p {
      color: var(--text-dim);
      margin-top: 5px;
    }
    .tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      color: var(--text-dim);
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      color: var(--text-dim);
      font-size: 14px;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 16px;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .btn {
      width: 100%;
      padding: 14px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .error {
      background: rgba(218, 54, 51, 0.1);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }
    .success {
      background: rgba(35, 134, 54, 0.1);
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }
    .form { display: none; }
    .form.active { display: block; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <h1>🔐 NetControl</h1>
      <p>Gestión de-red</p>
    </div>
    
    <div id="error" class="error"></div>
    <div id="success" class="success"></div>
    
    <div class="tabs">
      <div class="tab active" onclick="showTab('login')">Iniciar Sesión</div>
      <div class="tab" onclick="showTab('register')">Registrarse</div>
    </div>
    
    <form id="login-form" class="form active" onsubmit="return handleLogin(event)">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="username" required>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn" id="login-btn">Entrar</button>
    </form>
    
    <form id="register-form" class="form" onsubmit="return handleRegister(event)">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" name="username" required minlength="3">
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" required minlength="3">
      </div>
      <button type="submit" class="btn" id="register-btn">Crear Cuenta</button>
    </form>
  </div>

  <script>
    let currentTab = 'login';
    
    function showTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      document.querySelectorAll('.tab')[tab === 'login' ? 0 : 1].classList.add('active');
      document.getElementById(tab + '-form').classList.add('active');
      hideMessage();
    }
    
    function showError(msg) {
      const el = document.getElementById('error');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('success').style.display = 'none';
    }
    
    function showSuccess(msg) {
      const el = document.getElementById('success');
      el.textContent = msg;
      el.style.display = 'block';
      document.getElementById('error').style.display = 'none';
    }
    
    function hideMessage() {
      document.getElementById('error').style.display = 'none';
      document.getElementById('success').style.display = 'none';
    }
    
    async function handleLogin(e) {
      e.preventDefault();
      hideMessage();
      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      
      const form = e.target;
      const data = {
        username: form.username.value,
        password: form.password.value
      };
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        
        if (result.success) {
          window.location.href = '/index.html';
        } else {
          showError(result.error || 'Error al iniciar sesión');
        }
      } catch (err) {
        showError('Error de conexión');
      }
      
      btn.disabled = false;
      btn.textContent = 'Entrar';
      return false;
    }
    
    async function handleRegister(e) {
      e.preventDefault();
      hideMessage();
      const btn = document.getElementById('register-btn');
      btn.disabled = true;
      btn.textContent = 'Creando...';
      
      const form = e.target;
      const data = {
        username: form.username.value,
        password: form.password.value
      };
      
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();
        
        if (result.success) {
          showSuccess('¡Cuenta creada! Redirigiendo...');
          setTimeout(() => window.location.href = '/index.html', 1000);
        } else {
          showError(result.error || 'Error al registrar');
        }
      } catch (err) {
        showError('Error de conexión');
      }
      
      btn.disabled = false;
      btn.textContent = 'Crear Cuenta';
      return false;
    }
    
    // Check if already logged in
    (async () => {
      try {
        const res = await fetch('/api/auth/me');
        const result = await res.json();
        if (result.success) {
          window.location.href = '/index.html';
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
