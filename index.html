<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetControl - Network Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #08090c;
      --bg-secondary: #0d1117;
      --card: #13171d;
      --card-hover: #181d25;
      --border: #21262d;
      --border-light: #30363d;
      --text: #e6edf3;
      --text-muted: #7d8590;
      --text-dim: #484f58;
      --success: #2ea043;
      --success-dim: rgba(46, 160, 67, 0.15);
      --danger: #da3633;
      --danger-dim: rgba(218, 54, 51, 0.15);
      --warning: #d29922;
      --accent: #58a6ff;
      --accent-dim: rgba(88, 166, 255, 0.1);
      --windows: #0078d4;
      --linux: #e95420;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: linear-gradient(rgba(88,166,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(88,166,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: -1;
    }
    .container { max-width: 1400px; margin: 0 auto; padding: 32px; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }
    .logo { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--accent), #a371f7);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-icon svg { width: 24px; height: 24px; color: white; }
    .logo h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    .logo span { font-size: 12px; color: var(--text-muted); font-weight: 400; }
    
    .header-actions { display: flex; gap: 12px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }
    .btn:hover { background: var(--card-hover); border-color: var(--border-light); }
    .btn-primary { background: var(--accent); border-color: var(--accent); color: #000; }
    .btn-primary:hover { background: #79b8ff; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn svg { width: 16px; height: 16px; }
    
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .stat-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .stat-icon.online { background: var(--success-dim); color: var(--success); }
    .stat-icon.offline { background: var(--danger-dim); color: var(--danger); }
    .stat-icon.scanning { background: var(--accent-dim); color: var(--accent); }
    .stat-icon.total { background: var(--warning-dim); color: var(--warning); }
    .stat-card.clickable { cursor: pointer; transition: all 0.2s; }
    .stat-card.clickable:hover { border-color: var(--accent); transform: translateY(-2px); }
    .stat-card.active { border-color: var(--accent); background: var(--card-hover); }
    .stat-icon svg { width: 22px; height: 22px; }
    .stat-info h3 { font-size: 28px; font-weight: 700; letter-spacing: -1px; }
    .stat-info p { font-size: 13px; color: var(--text-muted); }
    
    .scan-controls {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .scan-range { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 300px; }
    .scan-range label { font-size: 13px; color: var(--text-muted); font-weight: 500; }
    .ip-inputs { display: flex; align-items: center; gap: 8px; }
    .ip-input {
      display: flex;
      align-items: center;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 12px;
      gap: 8px;
    }
    .ip-input span { font-family: 'JetBrains Mono', monospace; color: var(--text-dim); font-size: 14px; }
    .ip-input input {
      width: 60px;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      text-align: center;
    }
    .ip-input input:focus { outline: none; }
    .subnet-select {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      padding: 10px 14px;
      cursor: pointer;
    }
    .subnet-select:focus { outline: none; border-color: var(--accent); }
    
    .scan-progress { display: none; margin-bottom: 24px; }
    .scan-progress.active { display: block; }
    .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-bottom: 12px; }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #a371f7);
      border-radius: 3px;
      width: 0%;
      transition: width 0.3s;
    }
    .progress-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); }
    
    .hosts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }
    .host-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      transition: all 0.2s;
      animation: fadeIn 0.3s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .host-card:hover { border-color: var(--border-light); background: var(--card-hover); }
    .host-card.online { border-left: 3px solid var(--success); }
    .host-card.offline { border-left: 3px solid var(--danger); opacity: 0.7; }
    
    .host-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .host-info h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .host-info p { font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--text-muted); }
    
    .host-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .host-status.online { background: var(--success-dim); color: var(--success); }
    .host-status.offline { background: var(--danger-dim); color: var(--danger); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.online { background: var(--success); }
    .status-dot.offline { background: var(--danger); }
    
    .host-details { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 16px; border-top: 1px solid var(--border); }
    .detail { display: flex; flex-direction: column; gap: 4px; }
    .detail label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
    .detail span { font-size: 13px; color: var(--text); font-weight: 500; }
    
    .os-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      background: var(--accent-dim);
      color: var(--accent);
    }
    .os-badge.windows { background: rgba(0, 120, 212, 0.15); color: var(--windows); }
    .os-badge.linux { background: rgba(233, 84, 32, 0.15); color: var(--linux); }
    .os-badge.macos { background: rgba(255, 255, 255, 0.15); color: #ffffff; }
    .os-badge svg { width: 14px; height: 14px; }
    
    .host-actions { display: flex; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .host-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .host-btn:hover { background: var(--card-hover); color: var(--text); border-color: var(--border-light); }
    .host-btn svg { width: 14px; height: 14px; }
    
    .empty { grid-column: 1 / -1; text-align: center; padding: 80px 20px; }
    .empty svg { width: 80px; height: 80px; color: var(--text-dim); margin-bottom: 20px; }
    .empty h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
    .empty p { color: var(--text-muted); font-size: 14px; }
    
    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px; gap: 16px; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading p { color: var(--text-muted); font-size: 14px; }
    
    @media (max-width: 768px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .scan-controls { flex-direction: column; align-items: stretch; }
      .hosts-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 10h.01"/><path d="M12 10h.01"/><path d="M17 10h.01"/>
          </svg>
        </div>
        <div><h1>NetControl</h1><span>Remote PC Manager</span></div>
      </div>
      <div class="header-actions">
        <button class="btn" id="refreshBtn" onclick="refreshScan()">Refresh</button>
        <button class="btn btn-primary" id="scanBtn" onclick="startScan()">Scan Network</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat-card clickable" onclick="filterHosts('all')" id="stat-all">
        <div class="stat-icon total"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg></div>
        <div class="stat-info"><h3 id="total-count">0</h3><p>Total Hosts</p></div>
      </div>
      <div class="stat-card clickable" onclick="filterHosts('online')" id="stat-online">
        <div class="stat-icon online"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22,4 12,14.01 9,11.01"/></svg></div>
        <div class="stat-info"><h3 id="online-count">0</h3><p>Online</p></div>
      </div>
      <div class="stat-card clickable" onclick="filterHosts('offline')" id="stat-offline">
        <div class="stat-icon offline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg></div>
        <div class="stat-info"><h3 id="offline-count">0</h3><p>Offline</p></div>
      </div>
      <div class="stat-card clickable" onclick="filterHosts('linux')" id="stat-linux">
        <div class="stat-icon" style="background: rgba(233,84,32,0.15); color: #e95420;"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h18v18H3V3zm16.5 16.5v-15l-7 7.5h5.5v7.5zm-9-7.5l-7.5 7.5h5v-7.5h2.5z"/></svg></div>
        <div class="stat-info"><h3 id="linux-count">0</h3><p>Linux</p></div>
      </div>
      <div class="stat-card clickable" onclick="filterHosts('windows')" id="stat-windows">
        <div class="stat-icon" style="background: rgba(0,120,212,0.15); color: #0078d4;"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5l8-3v13l-8-3V5.5zm8-3v13l8-3v-13l-8 3zm8 16l-8-3v-13l8 3v13z"/></svg></div>
        <div class="stat-info"><h3 id="windows-count">0</h3><p>Windows</p></div>
      </div>
      <div class="stat-card clickable" onclick="filterHosts('macos')" id="stat-macos">
        <div class="stat-icon" style="background: rgba(255,255,255,0.15); color: #ffffff;"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 7h-3.2l-.7 3.4-3.3.5 2.5 2.5-2.3 3.2 3.1 1.9 3.1-1.9-2.3-3.2 2.5-2.5-3.3-.5L18 7zm-9.2 9.8c-.6 0-1.1-.5-1.1-1.1s.5-1.1 1.1-1.1 1.1.5 1.1 1.1-.5 1.1-1.1 1.1zM12 3c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4z"/></svg></div>
        <div class="stat-info"><h3 id="macos-count">0</h3><p>MacOS</p></div>
      </div>
    </div>

    <div class="scan-controls">
      <div class="scan-range">
        <label>Subnet</label>
        <select id="subnet-select" class="subnet-select" onchange="updateSubnet()">
          <option value="192.168.227">192.168.227.x (local)</option>
          <option value="150.214.127">150.214.127.x (externa)</option>
        </select>
      </div>
      <div class="scan-range">
        <label>IP Range</label>
        <div class="ip-inputs">
          <div class="ip-input"><span id="ip-prefix">192.168.227.</span><input type="number" id="ip-start" value="1" min="1" max="254"></div>
          <span style="color: var(--text-dim)">→</span>
          <div class="ip-input"><span id="ip-prefix-end">192.168.227.</span><input type="number" id="ip-end" value="254" min="1" max="254"></div>
        </div>
      </div>
    </div>

    <div class="scan-progress" id="progress">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-info"><span id="progress-text">Scanning...</span><span id="progress-percent">0%</span></div>
    </div>

    <div class="hosts-grid" id="hosts-grid">
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 10h.01"/><path d="M12 10h.01"/><path d="M17 10h.01"/>
        </svg>
        <h3>No hosts scanned yet</h3>
        <p>Click "Scan Network" to discover devices on your network</p>
      </div>
    </div>
  </div>

  <script>
    let hosts = [];
    let isScanning = false;
    let currentFilter = 'all';

    function setScanning(scanning) {
      isScanning = scanning;
      document.getElementById('scanBtn').disabled = scanning;
      document.getElementById('scanBtn').textContent = scanning ? 'Scanning...' : 'Scan Network';
      document.getElementById('progress').classList.toggle('active', scanning);
    }

    function updateSubnet() {
      const subnet = document.getElementById('subnet-select').value;
      document.getElementById('ip-prefix').textContent = subnet + '.';
      document.getElementById('ip-prefix-end').textContent = subnet + '.';
    }

    function filterHosts(filter) {
      currentFilter = filter;
      
      // Update active stat card
      document.querySelectorAll('.stat-card').forEach(c => c.classList.remove('active'));
      const statEl = document.getElementById('stat-' + filter);
      if (statEl) statEl.classList.add('active');
      
      renderHosts();
    }

    async function startScan() {
      if (isScanning) return;
      
      const subnet = document.getElementById('subnet-select').value;
      const start = parseInt(document.getElementById('ip-start').value);
      const end = parseInt(document.getElementById('ip-end').value);
      
      if (start > end) { alert('Start IP must be less than End IP'); return; }

      setScanning(true);
      hosts = [];
      document.getElementById('hosts-grid').innerHTML = '<div class="loading"><div class="spinner"></div><p>Scanning ' + subnet + '.x range...</p></div>';
      
      try {
        const response = await fetch('/api/scan', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            start: subnet + '.' + start,
            end: subnet + '.' + end
          })
        });
        
        const data = await response.json();
        
        if (data.success) {
          hosts = data.hosts;
          renderHosts();
        } else {
          throw new Error(data.error || 'Scan failed');
        }
      } catch (e) {
        console.error('Scan error:', e);
        document.getElementById('hosts-grid').innerHTML = '<div class="empty"><h3>Error</h3><p>' + e.message + '</p></div>';
      }
      
      setScanning(false);
    }

    function renderHosts() {
      const grid = document.getElementById('hosts-grid');
      
      // Filter hosts based on current filter
      let filteredHosts = hosts;
      if (currentFilter === 'online') {
        filteredHosts = hosts.filter(h => h.status === 'online');
      } else if (currentFilter === 'offline') {
        filteredHosts = hosts.filter(h => h.status === 'offline');
      } else if (currentFilter === 'linux') {
        filteredHosts = hosts.filter(h => h.status === 'online' && h.os === 'linux');
      } else if (currentFilter === 'windows') {
        filteredHosts = hosts.filter(h => h.status === 'online' && h.os === 'windows');
      } else if (currentFilter === 'macos') {
        filteredHosts = hosts.filter(h => h.status === 'online' && h.os === 'macos');
      }
      
      // Sort: online first, then by IP (numerically)
      filteredHosts = filteredHosts.sort((a, b) => {
        if (a.status !== b.status) return a.status === 'online' ? -1 : 1;
        const aNum = parseInt(a.ip.split('.').pop());
        const bNum = parseInt(b.ip.split('.').pop());
        return aNum - bNum;
      });
      
      if (filteredHosts.length === 0) {
        grid.innerHTML = '<div class="empty"><h3>No hosts found</h3><p>Run a scan or try a different filter</p></div>';
        updateStats();
        return;
      }
      
      grid.innerHTML = filteredHosts.map((host, i) => {
        const isOnline = host.status === 'online';
        const osIcon = host.os === 'windows' 
          ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5l8-3v13l-8-3V5.5zm8-3v13l8-3v-13l-8 3zm8 16l-8-3v-13l8 3v13z"/></svg>'
          : host.os === 'macos'
          ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 7h-3.2l-.7 3.4-3.3.5 2.5 2.5-2.3 3.2 3.1 1.9 3.1-1.9-2.3-3.2 2.5-2.5-3.3-.5L18 7zm-9.2 9.8c-.6 0-1.1-.5-1.1-1.1s.5-1.1 1.1-1.1 1.1.5 1.1 1.1-.5 1.1-1.1 1.1zM12 3c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4z"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h18v18H3V3zm16.5 16.5v-15l-7 7.5h5.5v7.5zm-9-7.5l-7.5 7.5h5v-7.5h2.5z"/></svg>';
        
        return '<div class="host-card ' + host.status + '" style="animation-delay: ' + (i * 0.02) + 's">' +
          '<div class="host-header">' +
            '<div class="host-info"><h4>' + (host.hostname || 'Unknown') + '</h4><p>' + host.ip + '</p></div>' +
            '<div class="host-status ' + host.status + '"><span class="status-dot ' + host.status + '"></span>' + (isOnline ? 'Online' : 'Offline') + '</div>' +
          '</div>' +
          '<div class="host-details">' +
            '<div class="detail"><label>Response</label><span>' + (host.responseTime ? host.responseTime + 'ms' : '-') + '</span></div>' +
            '<div class="detail"><label>Hostname</label><span>' + (host.hostname || '-') + '</span></div>' +
            '<div class="detail"><label>OS</label><span class="os-badge ' + host.os + '">' + osIcon + ' ' + host.os + '</span></div>' +
            '<div class="detail"><label>Open Ports</label><span>' + (host.openPorts ? host.openPorts.join(', ') : '-') + '</span></div>' +
          '</div>' +
          (isOnline ? '<div class="host-actions"><button class="host-btn" onclick="pingHost(\'' + host.ip + '\')">Ping</button><button class="host-btn" onclick="remoteDesktop(\'' + host.ip + '\')">RDP</button><button class="host-btn" onclick="sshHost(\'' + host.ip + '\')">SSH</button></div>' : '') +
        '</div>';
      }).join('');
      
      updateStats();
    }

    function updateStats() {
      const online = hosts.filter(h => h.status === 'online').length;
      const offline = hosts.length - online;
      const linux = hosts.filter(h => h.status === 'online' && h.os === 'linux').length;
      const windows = hosts.filter(h => h.status === 'online' && h.os === 'windows').length;
      const macos = hosts.filter(h => h.status === 'online' && h.os === 'macos').length;
      
      document.getElementById('total-count').textContent = hosts.length;
      document.getElementById('online-count').textContent = online;
      document.getElementById('offline-count').textContent = offline;
      document.getElementById('linux-count').textContent = linux;
      document.getElementById('windows-count').textContent = windows;
      document.getElementById('macos-count').textContent = macos;
    }

    function refreshScan() { if (!isScanning) startScan(); }
    
    async function pingHost(ip) {
      const btn = event.target;
      btn.disabled = true;
      btn.textContent = '...';
      
      try {
        const res = await fetch('/api/ping?ip=' + ip);
        const data = await res.json();
        
        if (data.online) {
          alert('✓ ' + ip + ' respondio en ' + data.responseTime + 'ms');
        } else {
          alert('✗ ' + ip + ' no responde');
        }
      } catch (e) {
        alert('Error: ' + e.message);
      }
      
      btn.disabled = false;
      btn.textContent = 'Ping';
    }
    
    function remoteDesktop(ip) {
      // Open RDP viewer page
      window.open('/rdp.html?ip=' + ip, '_blank');
    }
    
    function sshHost(ip) {
      // Open integrated terminal
      window.open('/terminal.html?ip=' + ip + '&user=manolo', '_blank');
    }
  </script>
</body>
</html>
